application:
  name: forage-midas-flow

management:
  endpoints:
    web:
      exposure:
        include: '*'

server:
  port: 33400  # Fixed indentation

general:
  kafka-topic: trader-updates  # FIX 1: Task 1 config, not "transactions"

spring:
  datasource:
    url: jdbc:h2:mem:testdb  # Standard H2 memory DB
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # FIX 2: create-drop destroys data between tests
    show-sql: true  # Helpful for debugging

  h2:  # H2 console (Task 1)
    console:
      enabled: true

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}  #  FIX 3: Testcontainers auto-config
    consumer:  #  FIX 4: Typo "boostrap-servers" → "bootstrap-servers"
      group-id: midas-core-group  #  FIX 5: Consistent naming
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
